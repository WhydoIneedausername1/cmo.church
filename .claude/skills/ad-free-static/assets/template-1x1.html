<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1080" />
  <title>Ad 1:1 — {{CONCEPT_NAME}}</title>
  <style>
    :root {
      --brand-bg: #0B0B0C;
      --brand-surface: #161618;
      --brand-text: #F5F5F4;
      --brand-muted: #A8A29E;
      --brand-accent: #E7E5E4;
      --brand-cta: #F5F5F4;
      --brand-cta-text: #0B0B0C;
      --font-display: Georgia, "Times New Roman", serif;
      --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
      --pad: 64px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1080px; overflow: hidden;
      background: var(--brand-bg); color: var(--brand-text);
      font-family: var(--font-body);
    }
    .stage {
      position: relative; width: 1080px; height: 1080px;
      background: var(--brand-bg);
    }
    .photo {
      position: absolute; inset: 0;
      background: center/cover no-repeat url("{{PHOTO_LAYER_URL}}");
    }
    .scrim {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.55) 100%);
      pointer-events: none;
    }
    .content {
      position: absolute; inset: var(--pad);
      display: flex; flex-direction: column; justify-content: flex-end; gap: 20px;
    }
    .logo { position: absolute; top: var(--pad); left: var(--pad); height: 48px; width: auto; }
    .eyebrow {
      font-family: var(--font-body); font-size: 22px; letter-spacing: 0.02em;
      color: var(--brand-muted); text-transform: none; /* avoid tracked ALL-CAPS slop */
    }
    .headline {
      font-family: var(--font-display); font-size: 64px; line-height: 1.05;
      font-weight: 600; max-width: 18ch;
    }
    .body { font-size: 28px; line-height: 1.35; color: var(--brand-muted); max-width: 32ch; }
    .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .price {
      font-size: 32px; font-weight: 700; color: var(--brand-accent);
      font-variant-numeric: tabular-nums;
    }
    .cta {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 64px; padding: 0 36px; border-radius: 999px;
      background: var(--brand-cta); color: var(--brand-cta-text);
      font-size: 26px; font-weight: 650; text-decoration: none;
    }
    .legal {
      font-size: 16px; line-height: 1.3; color: var(--brand-muted); max-width: 60ch;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="photo" role="img" aria-label="User or stock photo layer"></div>
    <div class="scrim"></div>
    <img class="logo" src="{{LOGO_URL}}" alt="{{BRAND_NAME}}" />
    <div class="content">
      <div class="eyebrow">{{EYEBROW}}</div>
      <h1 class="headline">{{HEADLINE}}</h1>
      <p class="body">{{BODY}}</p>
      <div class="row">
        <span class="price">{{PRICE}}</span>
        <span class="cta">{{CTA}}</span>
      </div>
      <p class="legal">{{LEGAL}}</p>
    </div>
  </div>
</body>
</html>

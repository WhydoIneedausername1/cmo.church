<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Ad 9:16 — {{CONCEPT_NAME}}</title>
  <style>
    :root {
      --brand-bg: #0B0B0C;
      --brand-surface: #161618;
      --brand-text: #F5F5F4;
      --brand-muted: #A8A29E;
      --brand-accent: #E7E5E4;
      --brand-cta: #F5F5F4;
      --brand-cta-text: #0B0B0C;
      --font-display: Georgia, "Times New Roman", serif;
      --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
      --pad: 56px;
      --safe-top: 250px;
      --safe-bottom: 340px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: var(--brand-bg); color: var(--brand-text);
      font-family: var(--font-body);
    }
    .stage { position: relative; width: 1080px; height: 1920px; }
    .photo {
      position: absolute; inset: 0;
      background: center/cover no-repeat url("{{PHOTO_LAYER_URL}}");
    }
    .scrim {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.1) 40%, rgba(0,0,0,.65) 100%);
    }
    /* Guides (remove for final render if desired): safe zones */
    .safe-guide-top, .safe-guide-bottom {
      position: absolute; left: 0; right: 0; pointer-events: none;
      outline: 1px dashed rgba(255,255,255,.15);
      display: none; /* set display:block while designing */
    }
    .safe-guide-top { top: 0; height: var(--safe-top); }
    .safe-guide-bottom { bottom: 0; height: var(--safe-bottom); }
    .logo {
      position: absolute; top: calc(var(--safe-top) + 12px); left: var(--pad);
      height: 48px; width: auto; z-index: 2;
    }
    .content {
      position: absolute;
      left: var(--pad); right: var(--pad);
      top: calc(var(--safe-top) + 72px);
      bottom: calc(var(--safe-bottom) + 24px);
      display: flex; flex-direction: column; justify-content: flex-end; gap: 22px;
    }
    .eyebrow { font-size: 24px; color: var(--brand-muted); }
    .headline {
      font-family: var(--font-display); font-size: 68px; line-height: 1.05;
      font-weight: 600; max-width: 14ch;
    }
    .body { font-size: 30px; line-height: 1.35; color: var(--brand-muted); max-width: 28ch; }
    .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .price { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .cta {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 68px; padding: 0 40px; border-radius: 999px;
      background: var(--brand-cta); color: var(--brand-cta-text);
      font-size: 28px; font-weight: 650;
    }
    .legal {
      font-size: 16px; line-height: 1.3; color: var(--brand-muted);
      /* legal may sit nearer bottom band but keep readable */
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="photo" role="img" aria-label="User or stock photo layer"></div>
    <div class="scrim"></div>
    <div class="safe-guide-top"></div>
    <div class="safe-guide-bottom"></div>
    <img class="logo" src="{{LOGO_URL}}" alt="{{BRAND_NAME}}" />
    <div class="content">
      <div class="eyebrow">{{EYEBROW}}</div>
      <h1 class="headline">{{HEADLINE}}</h1>
      <p class="body">{{BODY}}</p>
      <div class="row">
        <span class="price">{{PRICE}}</span>
        <span class="cta">{{CTA}}</span>
      </div>
      <p class="legal">{{LEGAL}}</p>
    </div>
  </div>
</body>
</html>
